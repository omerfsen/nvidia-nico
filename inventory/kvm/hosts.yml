---
# The NICo lab on KVM/libvirt. kvm_hosts is the hypervisor (this machine);
# the site cluster nodes are VMs that playbooks/cluster.yml creates on it and
# adds to the nico_nodes group at run time.
all:
  children:
    kvm_hosts:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    nico_nodes:
