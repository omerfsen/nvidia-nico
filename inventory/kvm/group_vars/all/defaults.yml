---
# Defaults for the KVM lab. Override in local.yml next to this file
# (gitignored, loaded after this one): with a group_vars/all/ directory
# Ansible ignores a group_vars/all.yml file.

# The site network: cluster nodes, MetalLB VIPs and the lab registry.
nico_kvm_site_network: nico-site
nico_kvm_site_subnet: 192.168.91
nico_kvm_site_gateway: "{{ nico_kvm_site_subnet }}.1"

# The HostInband network: the "servers" NICo manages (host NICs and their
# mock BMCs). No libvirt DHCP: NICo's DHCP answers through a relay on the
# host.
nico_kvm_inband_network: nico-inband
nico_kvm_inband_subnet: 192.168.92

nico_kvm_networks:
  - name: "{{ nico_kvm_site_network }}"
    bridge: virbr-nicosite
    address: "{{ nico_kvm_site_gateway }}"
    prefix: 24
    # libvirt DHCP hands out reservations (the nodes) and this range; the
    # MetalLB pool (.200-.250) stays outside it.
    dhcp_start: "{{ nico_kvm_site_subnet }}.150"
    dhcp_end: "{{ nico_kvm_site_subnet }}.199"
  - name: "{{ nico_kvm_inband_network }}"
    bridge: virbr-nicoib
    address: "{{ nico_kvm_inband_subnet }}.1"
    prefix: 24

nico_kvm_disk_path: /var/lib/libvirt/images
nico_kvm_ssh_key_dir: ~/.ssh/nico

# Site cluster: three Ubuntu 24.04 VMs, all schedulable (NICo needs three
# for HA Vault and PostgreSQL). The first one is the control plane.
nico_kvm_node_names: [nico-node-01, nico-node-02, nico-node-03]
nico_kvm_node_first_octet: 11
nico_kvm_node_size: {vcpus: 6, memory_mb: 12288, disk_gb: 80}

# Every site cluster VM: name, ip, mac.
nico_kvm_nodes: >-
  {%- set vms = [] -%}
  {%- for name in nico_kvm_node_names -%}
  {%- set octet = nico_kvm_node_first_octet + loop.index0 -%}
  {%- set _ = vms.append({'name': name,
                          'ip': nico_kvm_site_subnet ~ '.' ~ octet,
                          'mac': '52:54:00:91:00:%02x' | format(octet)}) -%}
  {%- endfor -%}
  {{ vms }}

# kubeconfig for the site cluster, written on this machine.
nico_kvm_kubeconfig: ~/.kube/nico-site.yaml

# The lab registry on this host (site network address), and where the NICo
# images live in it.
nico_kvm_registry_address: "{{ nico_kvm_site_gateway }}"
nico_kvm_registry_port: 5000
nico_kvm_registry_repo: "{{ nico_kvm_registry_address }}:{{ nico_kvm_registry_port }}/nico"
nico_kvm_registry_ca: /etc/nico-registry/pki/ca.crt

# NICo release whose images are built.
nico_kvm_nico_version: v2.3.0
# Published copies of the lab's images (unofficial builds of that release
# from source, plus the patched bmc-mock and the unbound image). Missing
# images are copied from here before anything is built; "" always builds.
nico_kvm_images_seed: docker.io/omerfsen

# The throwaway VM the images are built on (NICo asks for 150 GB free disk).
# Removed after a successful build unless nico_kvm_build_vm_keep is true.
nico_kvm_build_vm:
  name: nico-build
  ip: "{{ nico_kvm_site_subnet }}.20"
  mac: "52:54:00:91:00:14"
  vcpus: 16
  memory_mb: 32768
  disk_gb: 200
nico_kvm_build_vm_keep: false

# The servers NICo manages: VMs on the HostInband network, each with a mock
# Redfish BMC (bmc-mock, Dell R750 profile, no DPUs). index is bmc-mock's
# instance index (unique identities); bmc_ip sits in the segment's reserved
# range (.1-.10 are the gateway and the relay, see nico_hostinband_networks).
nico_kvm_cpu_servers:
  - name: nico-server-01
    index: 1
    bmc_ip: "{{ nico_kvm_inband_subnet }}.11"
    vcpus: 4
    # NICo's scout downloads its 1.9 GB root squashfs into /run, a tmpfs
    # sized from RAM: with 8 GiB it fails ("curl: (23) Failure writing output").
    memory_mb: 16384
    disk_gb: 60

# A GPU server: the PCI functions of a GPU already bound to vfio-pci on this
# host (omerfsen.nvke.gpu_passthrough), e.g. ["0000:01:00.0", "0000:01:00.1"].
# Empty: no GPU server. VFIO pins all of the VM's memory.
nico_kvm_gpu_devices: []
nico_kvm_gpu_server:
  name: nico-server-02
  index: 2
  bmc_ip: "{{ nico_kvm_inband_subnet }}.12"
  vcpus: 8
  memory_mb: 24576
  disk_gb: 120

# Every server NICo manages.
nico_kvm_servers: >-
  {{ nico_kvm_cpu_servers
     + ([nico_kvm_gpu_server | combine({'hostdevs': nico_kvm_gpu_devices})]
        if nico_kvm_gpu_devices | length > 0 else []) }}
# nico-dhcp's VIP, where the segment's DHCP relay sends requests.
nico_kvm_dhcp_vip: "{{ nico_kvm_site_subnet }}.200"

# SLES 16 (Minimal VM, Cloud, QU3): downloading it takes a SUSE account, so the
# lab cannot fetch it. Point this at your copy, in local.yml, to add it to the
# OS images; empty: no SLES. Another build needs its own sha256 and filesystem
# UUID below (qemu-img, virt-filesystems).
nico_kvm_sles_image: ""
nico_kvm_sles_file: SLES-16.0-Minimal-VM.x86_64-Cloud-QU3.qcow2
nico_kvm_sles_sha256: a80f20e4c66ec6a1c93505ac605855e477c128e51eaec6d3f396d57dafa38fba
nico_kvm_extra_artifacts: >-
  {{ [{'path': 'os/' ~ nico_kvm_sles_file, 'src': nico_kvm_sles_image, 'sha256': nico_kvm_sles_sha256}]
     if nico_kvm_sles_image | length > 0 else [] }}
nico_kvm_extra_os_images: >-
  {{ [{'name': 'sles-16.0-qu3',
       'url': 'http://' ~ nico_kvm_site_gateway ~ ':8090/os/' ~ nico_kvm_sles_file,
       'digest': nico_kvm_sles_sha256,
       'boot_disk': '/dev/vda',
       'rootfs_label': 'ROOT',
       'efifs_id': '35ED-7A7C',
       'user': 'sles'}]
     if nico_kvm_sles_image | length > 0 else [] }}

# Servers NICo provisions an OS onto (playbooks/provision.yml): server
# name, the hostname each gets and its OS (a name from
# nico_instance_os_images). Ubuntu 24.04 on the CPU server, Rocky Linux 10.2
# on the GPU server (its boot shows on the GPU's display).
nico_kvm_instances: >-
  {{ [{'server': 'nico-server-01', 'hostname': 'nico-ubuntu-01', 'os': 'ubuntu-24.04-20261017'}]
     + ([{'server': nico_kvm_gpu_server.name, 'hostname': 'nico-rocky-02', 'os': 'rocky-10.2-20260525'}]
        if nico_kvm_gpu_devices | length > 0 else []) }}
