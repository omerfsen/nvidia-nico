---
namespace: omerfsen
name: nico
version: 0.1.1 # x-release-please-version
readme: README.md
authors:
  - Omer Sen
description: >-
  An NVIDIA Infra Controller (NICo) lab on KVM/libvirt: the site cluster, the
  NICo control plane built from source, and libvirt VMs with mock Redfish
  BMCs that NICo discovers, ingests and provisions.
license:
  - Apache-2.0

tags:
  - nico
  - nvidia
  - kubernetes
  - kubeadm
  - calico
  - k8s
  - baremetal
  - libvirt
  - infrastructure
dependencies:
  omerfsen.nvke: ">=0.2.0,<0.3.0"
repository: https://github.com/omerfsen/nvidia-nico
documentation: https://github.com/omerfsen/nvidia-nico/blob/main/README.md
issues: https://github.com/omerfsen/nvidia-nico/issues
build_ignore:
  - tests
  - "*.qcow2"
  - "*.img"
  - "*.iso"
  - "*.raw"
  - "*.vmdk"
  - .keys
  - "*_ed25519"
  - "*_ed25519.pub"
  - "*.key"
  - "*.kubeconfig"
  - "*.token"
  - "*.local.yml"
  - inventory/*/group_vars/all/local.yml
  - inventory/*/host_vars
  - __pycache__
  - "*.pyc"
  - .venv
  - .collections
  - .git
  - .github
  - .gitignore
  - graphify-out
  - tools
  - .ansible
  - .ansible-lint
  - Makefile
  - requirements.txt
  - ansible.cfg
  - "*.tar.gz"
  - version.txt
  - importer_result.json
  - release-please-config.json
  - .release-please-manifest.json
