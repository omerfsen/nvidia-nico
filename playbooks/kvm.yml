---
# The NICo lab on KVM/libvirt, in order: networks, the lab registry, the
# site cluster (its nodes trust the registry), NICo's images, then NICo's
# control plane, then the servers NICo manages.
#
#   ansible-playbook -i inventory/kvm omerfsen.nico.kvm

- name: Networks
  ansible.builtin.import_playbook: network.yml

- name: Registry
  ansible.builtin.import_playbook: registry.yml

- name: Site cluster
  ansible.builtin.import_playbook: cluster.yml

- name: Images
  ansible.builtin.import_playbook: images.yml

- name: NICo control plane
  ansible.builtin.import_playbook: nico.yml

- name: Servers, registered with NICo
  ansible.builtin.import_playbook: servers.yml
