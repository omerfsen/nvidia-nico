---
argument_specs:
  main:
    short_description: NVIDIA Infra Controller (NICo) control plane via helm-prereqs/setup.sh
    description:
      - 'Installs NICo''s control plane on an existing Kubernetes cluster from the controller with NICo''s
        own helm-prereqs/setup.sh (--skip-dpf --skip-rms): pinned helm, helmfile and helm-diff, the release
        checkout, a small unbound image, the lab''s values, then setup.sh only when an input changed,
        Vault unsealed, and a check that pods, VIPs and Keycloak are up.'
      - 'Zero-DPU site: one shared HostInband segment per nico_hostinband_networks entry, dpu_policy ignore.'
    options:
      nico_version:
        type: str
        default: v2.3.0
        description: Version.
      nico_commit:
        type: str
        default: abc446b33dc773d9b8c7f41b54cccf812758b165
        description: The commit the tag must point at.
      nico_repo:
        type: str
        default: https://github.com/dsx-ai-factory/infra-controller.git
        description: Repo.
      nico_kubeconfig:
        type: str
        default: ~/.kube/nico-site.yaml
        description: Admin kubeconfig of the site cluster, on this host.
      nico_image_registry:
        type: str
        default: 192.168.91.1:5000/nico
        description: Where the images are, and their tag (no scheme).
      nico_image_tag:
        type: str
        default: '{{ nico_version }}'
        description: Image tag.
      nico_registry_ca:
        type: str
        default: /etc/nico-registry/pki/ca.crt
        description: CA that trusts the registry, for preflight's registry checks on this host.
      nico_work_dir:
        type: str
        default: ~/.cache/omerfsen-nico
        description: 'Work area on this host: the NICo checkout, pinned tools, rendered values and logs.'
      nico_src:
        type: str
        default: '{{ nico_work_dir }}/infra-controller-{{ nico_version }}'
        description: Src.
      nico_tools_dir:
        type: str
        default: '{{ nico_work_dir }}/bin'
        description: Tools dir.
      nico_helm_version:
        type: str
        default: 3.22.1
        description: Helm version.
      nico_helm_sha256:
        type: str
        default: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
        description: nico_helm_sha256
      nico_helmfile_version:
        type: str
        default: 1.8.2
        description: Helmfile version.
      nico_helmfile_sha256:
        type: str
        default: f179485c5bb9f8e20fbd8ea16d8807915988aba4d60131ee864fb3232452716e
        description: nico_helmfile_sha256
      nico_helm_diff_version:
        type: str
        default: 3.15.15
        description: Helm diff version.
      nico_helm_diff_sha256:
        type: str
        default: 504e99410611daa70702362e1b10dc74929df8a912cb3f6b5d21d1ee9d0cb7d9
        description: nico_helm_diff_sha256
      nico_python:
        type: str
        default: /usr/bin/python3
        description: setup.sh and preflight need python3 with PyYAML; this one is put first on their PATH
          as `python3`.
      nico_site_name:
        type: str
        default: lab1
        description: Site name.
      nico_domain:
        type: str
        default: nico.lab
        description: Domain.
      nico_api_hostname:
        type: str
        default: api-{{ nico_site_name }}.{{ nico_domain }}
        description: Api hostname.
      nico_datacenter_asn:
        type: int
        default: 4266030000
        description: Data center ASN (FNN config is mandatory for nico-api; unused without DPUs).
      nico_metallb_internal_pool:
        type: str
        default: 192.168.91.200-192.168.91.239
        description: MetalLB L2 pools on the site network, and each service's VIP in them.
      nico_metallb_external_pool:
        type: str
        default: 192.168.91.240-192.168.91.250
        description: Metallb external pool.
      nico_vips:
        type: dict
        default:
          dhcp: 192.168.91.200
          pxe: 192.168.91.201
          unbound: 192.168.91.202
          ssh_console: 192.168.91.203
          dns:
            - 192.168.91.204
            - 192.168.91.205
          ntp:
            - 192.168.91.206
            - 192.168.91.207
            - 192.168.91.208
          api: 192.168.91.240
        description: Vips.
      nico_upstream_dns:
        type: str
        default: 192.168.91.1
        description: The resolver unbound forwards everything outside the site zones to.
      nico_hostinband_networks:
        type: list
        default:
          - name: lab-inband
            prefix: 192.168.92.0/24
            gateway: 192.168.92.1
            mtu: 1500
            reserve_first: 10
        description: 'Zero-DPU HostInband segments: the servers'' host NICs and BMCs share one relayed
          L2 (docs/provisioning/ip-and-network-configuration.md).'
        elements: dict
      nico_deny_prefixes:
        type: list
        default:
          - 192.168.91.0/24
        description: Networks instances must not reach (the site network).
        elements: str
      nico_pools:
        type: dict
        default:
          lo_ip:
            start: 10.254.0.10
            end: 10.254.0.250
          vlan_id:
            start: '100'
            end: '500'
          vni:
            start: '1024500'
            end: '1024800'
          vpc_vni:
            start: '1000'
            end: '1100'
        description: Pools nico-api allocates from (a range is applied once, on first sight).
      nico_vault_resources:
        type: dict
        default:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
        description: Vault server resources per replica. Upstream asks 2 CPU and 8 GiB each, which three
          12 GiB lab nodes cannot schedule.
      nico_api_resources:
        type: dict
        default:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '3'
            memory: 4Gi
        description: nico-api resources. Upstream asks 8 GiB.
      nico_postgres_resources:
        type: dict
        default:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 1Gi
        description: Small Postgres for a lab (upstream sizes it for a fleet).
      nico_unbound_base_image:
        type: str
        default: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
        description: 'unbound: NICo''s chart expects an internal NVIDIA image. The lab builds a small
          one (Alpine + unbound) and pushes it to the registry.'
      nico_unbound_package:
        type: str
        default: unbound=1.25.2-r2
        description: Unbound package.
      nico_unbound_image:
        type: str
        default: '{{ nico_image_registry }}/unbound'
        description: Unbound image.
      nico_unbound_tag:
        type: str
        default: 1.25.2-r2
        description: Unbound tag.
      nico_eso_image_repository:
        type: str
        default: ghcr.io/external-secrets/external-secrets
        description: 'External Secrets: its chart pulls from oci.external-secrets.io, a CNAME to a download-analytics
          gateway (gateway.scarf.sh) that DNS ad blockers often block. Pull the same image from GitHub''s
          registry instead.'
      nico_setup_timeout:
        type: int
        default: 5400
        description: How long setup.sh may run, in seconds.
