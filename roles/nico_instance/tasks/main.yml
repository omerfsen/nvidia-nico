---
- name: Settings
  ansible.builtin.set_fact:
    nico_instance_env:
      KUBECONFIG: "{{ nico_instance_kubeconfig | expanduser }}"
    nico_instance_cli: >-
      kubectl -n {{ nico_instance_namespace }} exec deploy/nico-lab-admin --
      /opt/carbide/nico-admin-cli
    nico_instance_api: "{{ nico_instance_rest_url }}/v2/org/{{ nico_instance_org }}/nico"

# ── REST token and tenant ────────────────────────────────────────────────
- name: REST token from Keycloak
  ansible.builtin.command: ./keycloak/get-token.sh
  args:
    chdir: "{{ nico_instance_nico_src | expanduser }}/helm-prereqs"
  environment: "{{ nico_instance_env }}"
  register: nico_instance_token
  changed_when: false
  no_log: true

- name: Headers
  ansible.builtin.set_fact:
    nico_instance_headers:
      # The script's output can carry other lines; take the JWT.
      Authorization: "Bearer {{ nico_instance_token.stdout_lines | select('match', '^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$') | last }}"
  no_log: true

# The first call creates the tenant account (with targeted instance
# creation); later calls return it.
- name: Tenant account
  ansible.builtin.uri:
    url: "{{ nico_instance_api }}/service-account/current"
    headers: "{{ nico_instance_headers }}"
  register: nico_instance_sa
  no_log: true  # the REST token is in the headers

- name: Site
  ansible.builtin.uri:
    url: "{{ nico_instance_api }}/site"
    headers: "{{ nico_instance_headers }}"
  register: nico_instance_sites
  no_log: true  # the REST token is in the headers

- name: Tenant and site IDs
  ansible.builtin.set_fact:
    nico_instance_tenant_id: "{{ nico_instance_sa.json.tenantId }}"
    nico_instance_site_id: "{{ (nico_instance_sites.json | selectattr('name', 'eq', nico_instance_site_name) | first).id }}"

# ── Machines NICo has, by name ───────────────────────────────────────────
- name: Machines
  ansible.builtin.shell: |
    set -o pipefail
    {{ nico_instance_cli }} -f json machine show 2>/dev/null | grep -v IGNORING
  args: {executable: /bin/bash}
  environment: "{{ nico_instance_env }}"
  register: nico_instance_machines
  changed_when: false

- name: Machine IDs and addresses of the servers to provision
  ansible.builtin.set_fact:
    nico_instance_targets: >-
      {%- set out = [] -%}
      {%- set machines = (nico_instance_machines.stdout | from_json).machines -%}
      {%- for want in nico_instance_instances -%}
      {%- set m = machines | selectattr('metadata.name', 'eq', want.server) | list -%}
      {%- if m | length == 0 -%}{{ 0 / 0 }}{%- endif -%}
      {%- set _ = out.append(want | combine({'machine_id': m[0].id})) -%}
      {%- endfor -%}
      {{ out }}

# ── Instance type, allocation, VPC (REST) ────────────────────────────────
- name: Instance types
  ansible.builtin.uri:
    url: "{{ nico_instance_api }}/instance/type"
    headers: "{{ nico_instance_headers }}"
  register: nico_instance_types
  no_log: true  # the REST token is in the headers

- name: Create the instance type
  ansible.builtin.uri:
    url: "{{ nico_instance_api }}/instance/type"
    method: POST
    headers: "{{ nico_instance_headers }}"
    body_format: json
    body: {name: "{{ nico_instance_type_name }}", siteId: "{{ nico_instance_site_id }}", description: "omerfsen.nico lab servers"}
    status_code: 201
  register: nico_instance_type_new
  when: nico_instance_types.json | selectattr('name', 'eq', nico_instance_type_name) | list | length == 0
  changed_when: true
  no_log: true  # the REST token is in the headers

- name: Instance type ID
  ansible.builtin.set_fact:
    nico_instance_type_id: >-
      {{ nico_instance_type_new.json.id if nico_instance_type_new is changed
         else (nico_instance_types.json | selectattr('name', 'eq', nico_instance_type_name) | first).id }}

# REST keeps its own copy of the machines, synced from the site, so it can
# lag the admin CLI: right after ingestion a server can be missing there or
# not Ready yet, and adding it to the instance type then fails (404/400).
# Wait until each server is in the instance type already or Ready in REST.
- name: Machines as REST sees them (each server known and Ready)
  ansible.builtin.uri:
    url: "{{ nico_instance_api }}/machine"
    headers: "{{ nico_instance_headers }}"
  register: nico_instance_rest_machines
  retries: "{{ (nico_instance_rest_ready_timeout | int / 15) | int }}"
  delay: 15
  until: >-
    nico_instance_rest_machines.json is defined
    and (nico_instance_targets | map(attribute='machine_id')
         | difference(nico_instance_rest_machines.json
                      | selectattr('instanceTypeId', 'defined')
                      | selectattr('instanceTypeId', 'eq', nico_instance_type_id) | map(attribute='id'))
         | difference(nico_instance_rest_machines.json
                      | selectattr('status', 'in', ['Ready', 'Reset']) | map(attribute='id'))
         | length == 0)
  no_log: true  # the REST token is in the headers

- name: Add the servers to the instance type
  ansible.builtin.uri:
    url: "{{ nico_instance_api }}/instance/type/{{ nico_instance_type_id }}/machine"
    method: POST
    headers: "{{ nico_instance_headers }}"
    body_format: json
    body: {machineIds: "{{ nico_instance_unassigned }}"}
    status_code: 201
  vars:
    nico_instance_unassigned: >-
      {{ nico_instance_targets | map(attribute='machine_id')
         | difference(nico_instance_rest_machines.json | selectattr('instanceTypeId', 'eq', nico_instance_type_id) | map(attribute='id')) }}
  when: nico_instance_unassigned | length > 0
  changed_when: true
  no_log: true  # the REST token is in the headers

- name: Allocations
  ansible.builtin.uri:
    url: "{{ nico_instance_api }}/allocation"
    headers: "{{ nico_instance_headers }}"
  register: nico_instance_allocations

# Created once, reserving as many servers as are listed now; listing more
# later needs a larger allocation (not updated in place).
  no_log: true  # the REST token is in the headers

- name: Create the allocation
  ansible.builtin.uri:
    url: "{{ nico_instance_api }}/allocation"
    method: POST
    headers: "{{ nico_instance_headers }}"
    body_format: json
    # One expression, so constraintValue stays a number: the API rejects
    # "1" ("Failed to parse request data").
    body: >-
      {{ {'name': nico_instance_allocation_name,
          'tenantId': nico_instance_tenant_id,
          'siteId': nico_instance_site_id,
          'allocationConstraints': [{'resourceType': 'InstanceType',
                                     'resourceTypeId': nico_instance_type_id,
                                     'constraintType': 'Reserved',
                                     'constraintValue': nico_instance_instances | length}]} }}
    status_code: 201
  when: nico_instance_allocations.json | selectattr('name', 'eq', nico_instance_allocation_name) | list | length == 0
  changed_when: true
  no_log: true  # the REST token is in the headers

- name: VPCs
  ansible.builtin.uri:
    url: "{{ nico_instance_api }}/vpc"
    headers: "{{ nico_instance_headers }}"
  register: nico_instance_vpcs
  no_log: true  # the REST token is in the headers

- name: Create the FLAT VPC
  ansible.builtin.uri:
    url: "{{ nico_instance_api }}/vpc"
    method: POST
    headers: "{{ nico_instance_headers }}"
    body_format: json
    body: {name: "{{ nico_instance_vpc_name }}", siteId: "{{ nico_instance_site_id }}", networkVirtualizationType: FLAT}
    status_code: 201
  register: nico_instance_vpc_new
  when: nico_instance_vpcs.json | selectattr('name', 'eq', nico_instance_vpc_name) | list | length == 0
  changed_when: true
  no_log: true  # the REST token is in the headers

- name: VPC ID
  ansible.builtin.set_fact:
    nico_instance_vpc_id: >-
      {{ nico_instance_vpc_new.json.id if nico_instance_vpc_new is changed
         else (nico_instance_vpcs.json | selectattr('name', 'eq', nico_instance_vpc_name) | first).id }}

# ── Segment, OS image, instances (admin CLI) ─────────────────────────────
- name: Network segments
  ansible.builtin.shell: |
    set -o pipefail
    {{ nico_instance_cli }} -f json network-segment show 2>/dev/null | grep -v IGNORING
  args: {executable: /bin/bash}
  environment: "{{ nico_instance_env }}"
  register: nico_instance_segments
  changed_when: false

- name: Attach the HostInband segment to the VPC
  ansible.builtin.command:
    argv: "{{ (nico_instance_cli | split) + ['--cloud-unsafe-op=' ~ nico_instance_operator, 'network-segment', 'attach-vpc',
           '--id', nico_instance_segment.id, '--vpc-id', nico_instance_vpc_id] }}"
  vars:
    nico_instance_segment: >-
      {{ (nico_instance_segments.stdout | from_json).network_segments
         | selectattr('metadata.name', 'eq', nico_instance_segment_name) | first }}
  environment: "{{ nico_instance_env }}"
  when: (nico_instance_segment.config.vpc_id | default('', true)) != nico_instance_vpc_id
  changed_when: true

- name: OS images
  ansible.builtin.shell: |
    set -o pipefail
    {{ nico_instance_cli }} -f json os-image show 2>/dev/null | grep -v IGNORING
  args: {executable: /bin/bash}
  environment: "{{ nico_instance_env }}"
  register: nico_instance_images
  changed_when: false

# Registered under a stable ID (from the name) when missing.
- name: Register the OS images that are missing
  ansible.builtin.command:
    argv: "{{ (nico_instance_cli | split) + ['os-image', 'create', '--id', item.name | to_uuid,
           '--name', item.name, '--tenant-org-id', nico_instance_org,
           '--url', item.url, '--digest', item.digest,
           '--boot-disk', item.boot_disk, '--efifs-id', item.efifs_id]
           + (['--rootfs-id', item.rootfs_id] if item.rootfs_id is defined else [])
           + (['--rootfs-label', item.rootfs_label] if item.rootfs_label is defined else [])
           + (['--bootfs-id', item.bootfs_id] if item.bootfs_id is defined else []) }}"
  environment: "{{ nico_instance_env }}"
  loop: "{{ nico_instance_all_os_images }}"
  loop_control: {label: "{{ item.name }}"}
  when: item.name not in (nico_instance_images.stdout | from_json | map(attribute='attributes') | map(attribute='name'))
  changed_when: true

- name: Image IDs by name, and each instance's image
  ansible.builtin.set_fact:
    nico_instance_image_ids: >-
      {{ dict(nico_instance_all_os_images | map(attribute='name')
              | zip(nico_instance_all_os_images | map(attribute='name') | map('to_uuid')))
         | combine(dict(nico_instance_images.stdout | from_json | map(attribute='attributes') | map(attribute='name')
              | zip(nico_instance_images.stdout | from_json | map(attribute='attributes') | map(attribute='id.value')))) }}
    nico_instance_targets: >-
      {%- set out = [] -%}
      {%- for t in nico_instance_targets -%}
      {%- set img = nico_instance_all_os_images | selectattr('name', 'eq', t.os | default(nico_instance_all_os_images[0].name)) | list -%}
      {%- if img | length == 0 -%}{{ 0 / 0 }}{%- endif -%}
      {%- set _ = out.append(t | combine({'image': img[0]})) -%}
      {%- endfor -%}
      {{ out }}

- name: SSH key for the instances
  ansible.builtin.command: ssh-keygen -q -t ed25519 -N '' -C nico-instance -f {{ nico_instance_ssh_key | expanduser }}
  args:
    creates: "{{ nico_instance_ssh_key | expanduser }}"

- name: Read the public key
  ansible.builtin.slurp:
    src: "{{ nico_instance_ssh_key | expanduser }}.pub"
  register: nico_instance_pubkey

- name: Instances
  ansible.builtin.shell: |
    set -o pipefail
    {{ nico_instance_cli }} -f json instance show 2>/dev/null | grep -v IGNORING
  args: {executable: /bin/bash}
  environment: "{{ nico_instance_env }}"
  register: nico_instance_existing
  changed_when: false

# Phone home off: its metadata service runs on a DPU, which these hosts lack.
- name: Allocate an instance on each server that has none
  ansible.builtin.command:
    argv: "{{ (nico_instance_cli | split) + ['--cloud-unsafe-op=' ~ nico_instance_operator, 'instance', 'allocate',
           '--prefix-name', item.hostname, '--flat-vpc-id', nico_instance_vpc_id,
           '--machine-id', item.machine_id, '--os', nico_instance_os_config | to_json] }}"
  vars:
    # prefer_fqdn_over_hostname: RHEL-family cloud-init otherwise names the
    # host after NICo's DNS name for its address, not the hostname here.
    nico_instance_cloud_config:
      hostname: "{{ item.hostname }}"
      prefer_fqdn_over_hostname: false
      ssh_authorized_keys:
        - "{{ nico_instance_pubkey.content | b64decode | trim }}"
    nico_instance_os_config:
      variant: {OsImageId: {value: "{{ nico_instance_image_ids[item.image.name] }}"}}
      phone_home_enabled: false
      run_provisioning_instructions_on_every_boot: false
      user_data: "#cloud-config\n{{ nico_instance_cloud_config | to_nice_yaml(indent=2) }}"
  environment: "{{ nico_instance_env }}"
  loop: "{{ nico_instance_targets }}"
  loop_control: {label: "{{ item.server }} -> {{ item.hostname }} ({{ item.image.name }})"}
  when: >-
    item.machine_id not in ((nico_instance_existing.stdout | from_json).instances | default([]) | map(attribute='machine_id') | list)
  changed_when: true

# ── Wait for the installed OS ────────────────────────────────────────────
- name: Each provisioned host answers SSH with its hostname
  ansible.builtin.command: >-
    ssh -i {{ nico_instance_ssh_key | expanduser }} -o BatchMode=yes -o ConnectTimeout=5
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ item.image.user }}@{{ nico_instance_address }} hostname
  vars:
    nico_instance_machine: >-
      {{ (nico_instance_machines.stdout | from_json).machines | selectattr('id', 'eq', item.machine_id) | first }}
    nico_instance_address: "{{ (nico_instance_machine.status.interfaces | selectattr('primary_interface') | first).address[0] }}"
  loop: "{{ nico_instance_targets }}"
  loop_control: {label: "{{ item.hostname }}"}
  register: nico_instance_ssh
  changed_when: false
  retries: "{{ (nico_instance_ssh_timeout | int / 20) | int }}"
  delay: 20
  until: nico_instance_ssh.rc == 0 and (nico_instance_ssh.stdout | trim) == item.hostname
  when: nico_instance_ssh_timeout | int > 0
