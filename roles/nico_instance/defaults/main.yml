---
# NICo provisions an OS onto Ready servers, from the controller: the tenant
# side through NICo's REST API (tenant account, instance type with the
# servers, allocation, a FLAT VPC: zero-DPU hosts use flat networking), the
# rest through the admin CLI in the cluster (OS image, segment attached to
# the VPC, one instance per server: the REST API has no field for a separate
# /boot partition and the admin CLI targets a machine directly). Then waits
# until each provisioned host answers SSH. Needs omerfsen.nico.nico_ingest
# (the admin pod) and the servers Ready.

nico_instance_kubeconfig: ~/.kube/nico-site.yaml
nico_instance_namespace: nico-system
# NICo's checkout on this host (keycloak/get-token.sh mints the REST token).
nico_instance_nico_src: ~/.cache/omerfsen-nico/infra-controller-v2.3.0
# REST API base (the nico-rest-api NodePort on a site node) and the org.
nico_instance_rest_url: http://192.168.91.11:30388
nico_instance_org: ncx
nico_instance_site_name: lab1

nico_instance_type_name: lab-vm
nico_instance_allocation_name: lab-alloc
nico_instance_vpc_name: flat-vpc-1
# The HostInband segment the instances' interfaces are on.
nico_instance_segment_name: lab-inband
# Name stamped on admin-CLI writes the REST side does not know about.
nico_instance_operator: nico-lab

# The OS images NICo can write to a server's disk (served by
# omerfsen.nico.nico_artifacts); each instance picks one by name (os), the
# first is the default. digest: plain hex sha256 (the imager picks the
# algorithm from the length; a "sha256:" prefix breaks it). The imager finds
# the root filesystem by rootfs_label or, for an image with no label, rootfs_id
# (its UUID). bootfs_id: only for an image with /boot on a partition of its
# own. user: the image's cloud-init default user, who gets the SSH key.
nico_instance_os_images:
  - name: ubuntu-24.04-20261017
    url: http://192.168.91.1:8090/os/ubuntu-24.04-server-cloudimg-amd64-20261017.img
    digest: 04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94
    boot_disk: /dev/vda
    rootfs_label: cloudimg-rootfs
    bootfs_id: b4f0deba-ce7d-45dc-9999-0427f2720320
    efifs_id: 0E9D-3FD8
    user: ubuntu
  - name: rocky-10.2-20260525
    url: http://192.168.91.1:8090/os/Rocky-10-GenericCloud-Base-10.2-20260525.0.x86_64.qcow2
    digest: 9fc9e9ff16888bb68ac39b0392e25c9c92684d50c85f1cce6ab549363bbc4b48
    boot_disk: /dev/vda
    rootfs_label: rocky
    bootfs_id: ac0faa30-b59a-4f1b-a77b-90cc245d6507
    efifs_id: D779-42D2
    user: rocky
  - name: debian-13-20261103
    url: http://192.168.91.1:8090/os/debian-13-generic-amd64-20261103-2651.qcow2
    digest: ee845b8abcc5107441c452a5454a5711b1dabec34b64bc5f370688003d7bf2ff
    boot_disk: /dev/vda
    rootfs_id: 96e538c4-e118-47a5-ad63-ddbd0e67f846
    efifs_id: 3845-82AF
    user: debian
  - name: almalinux-9.8-20261102
    url: http://192.168.91.1:8090/os/AlmaLinux-9-GenericCloud-9.8-20261102.x86_64.qcow2
    digest: 6f94881458dfe966474544b12e86d078d81a600457188045d317b0ce3c3bdca7
    boot_disk: /dev/vda
    rootfs_id: 9a722aa8-1420-4287-939d-8b17de48d486
    bootfs_id: c3e7137b-182e-4c4f-b9cb-14018782047e
    efifs_id: 1560-8FDA
    user: almalinux

# More images, for what the defaults cannot offer (no public download).
nico_instance_extra_os_images: []
# Derived: every image.
nico_instance_all_os_images: "{{ nico_instance_os_images + nico_instance_extra_os_images }}"

# Servers to provision: server (NICo machine name), hostname the installed
# OS gets, os (an image name above; default the first). Login with the key
# below as the image's user.
nico_instance_instances: []
nico_instance_ssh_key: ~/.ssh/nico/instance_ed25519

# Wait until each host answers SSH (0: do not wait).
nico_instance_ssh_timeout: 1800
# Wait until NICo's REST API sees each server Ready (it syncs from the site
# and can lag the admin CLI right after ingestion).
nico_instance_rest_ready_timeout: 600
