---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# The BMC and relay units are PartOf their namespace, so they restart too.
- name: Restart every lab network namespace
  ansible.builtin.shell: |
    set -o pipefail
    systemctl list-units --plain --no-legend 'nico-netns@*' | awk '{print $1}' | xargs -r systemctl restart
  args: {executable: /bin/bash}
  changed_when: true

- name: Restart the DHCP relay
  ansible.builtin.systemd_service:
    name: nico-dhcp-relay.service
    state: restarted

- name: Restart every mock BMC
  ansible.builtin.shell: |
    set -o pipefail
    systemctl list-units --plain --no-legend 'nico-bmc@*' | awk '{print $1}' | xargs -r systemctl restart
  args: {executable: /bin/bash}
  changed_when: true
