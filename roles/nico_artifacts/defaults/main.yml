---
# A plain HTTP file server on the KVM host for what the lab's servers fetch
# while they boot (NICo hands them URLs): OS images NICo writes to disk, and
# later other boot artifacts. nginx in a container, host networking,
# listening only on the host's address on the site network.

# nginx 1.31.7 (2026-10-15), pinned by index digest.
nico_artifacts_image: docker.io/library/nginx:1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
nico_artifacts_address: 192.168.91.1
nico_artifacts_port: 8090
# The bridge that carries nico_artifacts_address; the service waits for it.
nico_artifacts_interface: virbr-nicosite
nico_artifacts_dir: /var/lib/nico-artifacts

# Files to serve: path (relative to the served root), url, sha256.
nico_artifacts_files:
  # Ubuntu 24.04 LTS server cloud image, release 20261017
  # (https://cloud-images.ubuntu.com/releases/noble/release-20261017/SHA256SUMS).
  - path: os/ubuntu-24.04-server-cloudimg-amd64-20261017.img
    url: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-amd64.img
    sha256: 04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94

# Derived: the base URL the servers use.
nico_artifacts_base_url: "http://{{ nico_artifacts_address }}:{{ nico_artifacts_port }}"
