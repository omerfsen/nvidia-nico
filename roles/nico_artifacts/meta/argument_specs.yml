---
argument_specs:
  main:
    short_description: Plain HTTP file server for OS images and boot artifacts
    description:
      - 'On the KVM host: downloads each file in nico_artifacts_files (sha256 checked), writes a .sha256
        next to it, and serves the directory with nginx (pinned by digest) from a systemd unit, host networking,
        on the site network address.'
    options:
      nico_artifacts_image:
        type: str
        default: docker.io/library/nginx:1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
        description: nginx 1.31.7 (2026-10-15), pinned by index digest.
      nico_artifacts_address:
        type: str
        default: 192.168.91.1
        description: Address.
      nico_artifacts_port:
        type: int
        default: 8090
        description: Port.
      nico_artifacts_interface:
        type: str
        default: virbr-nicosite
        description: The bridge that carries nico_artifacts_address; the service waits for it.
      nico_artifacts_dir:
        type: str
        default: /var/lib/nico-artifacts
        description: Dir.
      nico_artifacts_files:
        type: list
        default:
          - path: os/ubuntu-24.04-server-cloudimg-amd64-20261017.img
            url: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-amd64.img
            sha256: 04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94
          - path: os/Rocky-10-GenericCloud-Base-10.2-20260525.0.x86_64.qcow2
            url: https://dl.rockylinux.org/pub/rocky/10.2/images/x86_64/Rocky-10-GenericCloud-Base-10.2-20260525.0.x86_64.qcow2
            sha256: 9fc9e9ff16888bb68ac39b0392e25c9c92684d50c85f1cce6ab549363bbc4b48
        description: 'Files to serve: path (relative to the served root), url, sha256.'
        elements: dict
      nico_artifacts_base_url:
        type: str
        default: http://{{ nico_artifacts_address }}:{{ nico_artifacts_port }}
        description: 'Derived: the base URL the servers use.'
